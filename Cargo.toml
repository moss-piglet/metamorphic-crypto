[package]
name = "metamorphic-crypto"
version = "0.3.6"
edition = "2024"
rust-version = "1.85"
description = "Zero-knowledge end-to-end encryption with post-quantum hybrid KEM (ML-KEM-768/1024 + X25519)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moss-piglet/metamorphic-crypto"
homepage = "https://metamorphic.app"
keywords = ["encryption", "e2e", "post-quantum", "ml-kem", "zero-knowledge"]
categories = ["cryptography", "wasm"]
readme = "README.md"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = { version = "0.5", features = ["alloc"] }
crypto_secretbox = "0.1"
crypto_box = "0.9"
blake2 = "0.10"
ml-kem = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha3 = "0.10"
base64 = "0.22"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
